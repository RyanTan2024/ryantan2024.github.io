<!DOCTYPE html>
<html lang="zh-CN" class="index-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="谭燃 Ryan Tan 的个人主页，记录成长点滴">
    <title>谭燃 Ryan Tan</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/hero-title.js" defer></script>
</head>
<body class="index-page">
    <div id="bg-blur">
        <div class="bg-layer" id="bg-layer-a"></div>
        <div class="bg-layer" id="bg-layer-b"></div>
    </div>
    <header class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-title-wrap">
                    <h1 class="hero-title">谭燃 (Ryan TAN)</h1>
                </div>
                <nav class="nav">
                    <ul>
                        <li><a href="index.html" class="active">相册</a></li>
                        <li><a href="foot.html">足迹</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <main>
        <section id="journal" class="journal-section">
            <div class="container">
                <h2 class="section-title"></h2>
                <div class="journal-container" id="journal-container">
                    <!-- 动态生成的日记内容 -->
                </div>
            </div>
        </section>
    </main>
    
    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 谭燃 (Ryan Tan)</p>
            </div>
        </div>
    </footer>
    
    <!-- 照片放大模态框 -->
    <div id="photo-modal" class="modal">
        <div class="modal-content">
            <img id="modal-img" src="" alt="">
        </div>
    </div>
    
    <script>
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const target = this.getAttribute('href');
                if (!target || target === '#') return;
                const el = document.querySelector(target);
                if (!el) return;
                e.preventDefault();
                el.scrollIntoView({ behavior: 'smooth' });
            });
        });
        
        // 加载日记数据
        function loadJournalData() {
            console.log('开始加载日记数据...');
            
            // 从 JSON 文件加载数据
            fetch('journal-data.json')
                .then(response => response.json())
                .then(data => {
                    window.journalData = data;
                    console.log('数据加载成功:', window.journalData);
                    
                    // 按日期降序排序，最新的在前面
                    window.journalData.sort((a, b) => {
                        // 确保日期格式一致，使用YYYY-MM-DD格式进行比较
                        const dateA = a.date.replace(/\//g, '-');
                        const dateB = b.date.replace(/\//g, '-');
                        return new Date(dateB) - new Date(dateA);
                    });
                    
                    // 渐进式加载日记
                    progressiveLoad(window.journalData);
                })
                .catch(error => {
                    console.error('加载日记数据失败:', error);
                });
        }
        
        // 一次性加载全部日记，避免网格反复重排导致页面左右抖动
        function progressiveLoad(items) {
            const container = document.getElementById('journal-container');
            container.innerHTML = '';

            items.forEach(item => {
                renderJournalItem(item);
            });

            lazyLoadImages();
            if (window.scrollRevealObserver) {
                window.scrollRevealObserver.observeItems(container);
            }
        }
        
        // HTML 转义，防止标题/路径中的特殊字符破坏属性
        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 渲染单个日记项目
        function renderJournalItem(item) {
            const container = document.getElementById('journal-container');
            const journalItem = document.createElement('div');
            let itemClass = 'journal-item';
            
            // 根据照片数量设置不同的类名
            if (item.photos && item.photos.length === 6) {
                itemClass += ' journal-item-wide-6';
            } else if (item.photos && item.photos.length === 3) {
                itemClass += ' journal-item-wide-3';
            } else if (item.photos && item.photos.length === 2) {
                itemClass += ' journal-item-wide-2';
            } else if (item.photos && item.photos.length === 4) {
                itemClass += ' journal-item-wide-4';
            }
            
            journalItem.className = itemClass;
            
            // 日期 - 显示为MM/YYYY格式
            const date = new Date(item.date);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const formattedDate = `${month}/${year}`;
            const dateHTML = `
                <div class="journal-header">
                    <div class="journal-date">${formattedDate}</div>
                </div>
            `;
            
            // 内容 - 使用title字段
            const contentHTML = `
                <div class="journal-content">
                    <p>${escapeHtml(item.title)}</p>
                </div>
            `;
            
            // 照片 - 使用title字段作为alt和caption
            let photosHTML = '';
            if (item.photo) {
                photosHTML = '<div class="journal-gallery">';
                // 尝试多种图片路径格式
                const photoPath = item.photo;
                photosHTML += `
                    <div class="gallery-item" data-src="${escapeHtml(photoPath)}" data-alt="${escapeHtml(item.title)}" onclick="openPhotoModal(this.dataset.src, this.dataset.alt)">
                        <img data-src="${escapeHtml(photoPath)}" alt="${escapeHtml(item.title)}" class="lazy-load" decoding="async">
                    </div>
                `;
                photosHTML += '</div>';
            }
            // 兼容旧格式（photos数组）
            else if (item.photos && item.photos.length > 0) {
                photosHTML = '<div class="journal-gallery">';
                item.photos.forEach(photo => {
                    const photoSrc = photo.src || photo;
                    photosHTML += `
                        <div class="gallery-item" data-src="${escapeHtml(photoSrc)}" data-alt="${escapeHtml(item.title)}" onclick="openPhotoModal(this.dataset.src, this.dataset.alt)">
                            <img data-src="${escapeHtml(photoSrc)}" alt="${escapeHtml(item.title)}" class="lazy-load" decoding="async">
                        </div>
                    `;
                });
                photosHTML += '</div>';
            }
            
            journalItem.innerHTML = dateHTML + contentHTML + photosHTML;
            container.appendChild(journalItem);
        }
        
        // 懒加载图片
        function lazyLoadImages() {
            const lazyImages = document.querySelectorAll('.lazy-load');

            lazyImages.forEach(img => {
                const rect = img.getBoundingClientRect();
                const windowHeight = window.innerHeight || document.documentElement.clientHeight;

                if (rect.top <= windowHeight + 200 && rect.bottom >= -200) {
                    img.src = img.dataset.src;
                    img.classList.remove('lazy-load');
                    img.classList.add('loaded');
                }
            });
        }

        window.addEventListener('scroll', lazyLoadImages, { passive: true });

        // 滚动时照片框从底部滑入
        function setupScrollReveal() {
            if (!('IntersectionObserver' in window)) {
                // 不支持时直接显示所有卡片
                document.getElementById('journal-container')
                    .querySelectorAll('.journal-item')
                    .forEach(function (el) { el.classList.add('visible'); });
                return;
            }

            const observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '0px 0px -10% 0px'
            });

            window.scrollRevealObserver = {
                observeItems: function (container) {
                    if (!container) return;
                    container.querySelectorAll('.journal-item:not(.visible)').forEach(function (item) {
                        observer.observe(item);
                    });
                }
            };
        }

        // 全局照片放大函数
        function openPhotoModal(src, alt) {
            const modal = document.getElementById('photo-modal');
            const modalImg = document.getElementById('modal-img');
            console.log('Opening photo modal:', src);
            modal.classList.add('show');
            modalImg.src = src;
            modalImg.alt = alt;
        }
        
        // 鼠标悬停照片时，页面背景虚化为该照片（双层交叉淡入）
        function setupBackgroundBlur() {
            const container = document.getElementById('journal-container');
            const layerA = document.getElementById('bg-layer-a');
            const layerB = document.getElementById('bg-layer-b');
            if (!container || !layerA || !layerB) return;

            let activeLayer = layerA;
            let inactiveLayer = layerB;
            let currentSrc = null;

            container.addEventListener('mouseover', function (e) {
                const item = e.target.closest('.gallery-item');
                if (!item) return;
                const img = item.querySelector('img');
                if (!img) return;
                const src = img.src || img.dataset.src;
                if (!src || src === currentSrc) return;
                currentSrc = src;

                // 在非活动层加载新图并淡入，原活动层淡出，形成交叉淡入
                inactiveLayer.style.backgroundImage = 'url("' + src + '")';
                inactiveLayer.classList.add('bg-active');
                activeLayer.classList.remove('bg-active');

                // 交换活动层
                const tmp = activeLayer;
                activeLayer = inactiveLayer;
                inactiveLayer = tmp;
            });

            container.addEventListener('mouseout', function (e) {
                const item = e.target.closest('.gallery-item');
                if (!item) return;
                const related = e.relatedTarget;
                if (!related || !item.contains(related)) {
                    activeLayer.classList.remove('bg-active');
                    currentSrc = null;
                }
            });
        }

        // 照片放大功能
        function setupPhotoModal() {
            const modal = document.getElementById('photo-modal');
            
            console.log('Photo modal setup started');
            console.log('Modal element:', modal);
            
            // 点击模态框任意位置关闭
            modal.addEventListener('click', function() {
                console.log('Modal clicked');
                modal.classList.remove('show');
            });
            
            // 按ESC键关闭
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('show')) {
                    console.log('Escape key pressed');
                    modal.classList.remove('show');
                }
            });
        }
        
        // DOM 就绪后立即加载相册，不等待第三方统计脚本
        document.addEventListener('DOMContentLoaded', function() {
            setupScrollReveal();
            loadJournalData();
            setupPhotoModal();
            setupBackgroundBlur();
        });

    </script>
</body>
</html>
